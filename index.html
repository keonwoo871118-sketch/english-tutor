<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나만의 AI 영어 튜터</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: white; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
        .header { background: #2563eb; color: white; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; }
        .api-box { background: #eff6ff; padding: 10px 15px; border-bottom: 1px solid #bfdbfe; display: flex; gap: 8px; align-items: center; font-size: 13px; }
        .api-box input { flex: 1; padding: 6px 10px; border: 1px solid #93c5fd; border-radius: 6px; font-size: 13px; outline: none; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { padding: 12px 15px; border-radius: 15px; max-width: 82%; line-height: 1.5; font-size: 15px; word-break: keep-all; }
        .ai-msg { background: #f3f4f6; align-self: flex-start; border-bottom-left-radius: 2px; color: #1f2937; }
        .user-msg { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .correction { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 8px 10px; margin-bottom: 8px; border-radius: 4px; font-size: 13.5px; color: #92400e; }
        .input-area { display: flex; padding: 12px; border-top: 1px solid #ddd; background: #fff; gap: 8px; align-items: center; }
        .input-area input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; outline: none; }
        button { padding: 11px 15px; background: #2563eb; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .mic-btn { background: #ef4444; padding: 11px 13px; font-size: 16px; }
        .mic-btn.recording { background: #dc2626; animation: pulse 1s infinite; }
        .speak-btn { background: #10b981; font-size: 12px; padding: 5px 10px; margin-top: 8px; border-radius: 5px; display: inline-block; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header">🇺🇸 나만의 AI 일상 영어 튜터</div>
        <div class="api-box">
            <span>🔑 API 키:</span>
            <input type="password" id="apiKeyInput" placeholder="AIza... 키를 입력하세요">
        </div>
        <div class="chat-box" id="chatBox">
            <div class="message ai-msg">
                안녕하세요! API 키를 넣고 영어로 말을 걸어보세요!<br><br>
                <b>"Hi there! How is your day going so far?"</b><br>
                <button class="speak-btn" id="welcomeSpeak">🔊 발음 듣기</button>
            </div>
        </div>
        <div class="input-area">
            <button class="mic-btn" id="micBtn" title="영어로 말하기">🎤</button>
            <input type="text" id="userInput" placeholder="영어로 말하거나 입력하세요...">
            <button id="sendBtn">전송</button>
        </div>
    </div>

    <script>
        function speak(text) {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.95;
            window.speechSynthesis.speak(utterance);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const apiKeyInput = document.getElementById('apiKeyInput');
            const userInput = document.getElementById('userInput');
            const sendBtn = document.getElementById('sendBtn');
            const micBtn = document.getElementById('micBtn');
            const chatBox = document.getElementById('chatBox');
            const welcomeSpeak = document.getElementById('welcomeSpeak');

            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
            }

            apiKeyInput.addEventListener('input', () => {
                localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
            });

            welcomeSpeak.addEventListener('click', () => {
                speak('Hi there! How is your day going so far?');
            });

            async function sendMessage() {
                const apiKey = apiKeyInput.value.trim();
                if (!apiKey) {
                    alert('맨 위 칸에 Gemini API 키를 먼저 입력해 주세요!');
                    return;
                }
                localStorage.setItem('gemini_api_key', apiKey);

                const text = userInput.value.trim();
                if (text === '') return;

                const userDiv = document.createElement('div');
                userDiv.className = 'message user-msg';
                userDiv.innerText = text;
                chatBox.appendChild(userDiv);
                userInput.value = '';
                chatBox.scrollTop = chatBox.scrollHeight;

                const loadingDiv = document.createElement('div');
                loadingDiv.className = 'message ai-msg';
                loadingDiv.innerText = 'AI 튜터가 답변을 준비 중이에요... ✍️';
                chatBox.appendChild(loadingDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

                try {
                    const prompt = `당신은 친절한 일상 영어 회화 튜터입니다. 사용자가 "${text}"라고 말했습니다. 
반드시 아래 JSON 형식으로만 답변해주세요 (다른 설명이나 마크다운 코드블록 없이 순수 JSON만 출력):
{
  "correction": "문법 교정 및 더 자연스러운 표현 팁 (한국어)",
  "reply_en": "이어서 대화를 나누는 자연스러운 영어 답변 1~2문장",
  "reply_ko": "위 영어 답변의 한국어 번역"
}`;

                    // 사용량이 여유로운 gemini-3.5-flash-lite 모델로 변경 적용
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    let rawText = data.candidates[0].content.parts[0].text;
                    rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    const result = JSON.parse(rawText);
                    const safeReplyEn = result.reply_en.replace(/'/g, "\\'");

                    loadingDiv.innerHTML = `
                        <div class="correction">💡 <b>교정 & 팁:</b> ${result.correction}</div>
                        <b>"${result.reply_en}"</b><br>
                        <span style="color:#6b7280; font-size:13.5px;">(${result.reply_ko})</span><br>
                        <button class="speak-btn">🔊 발음 다시 듣기</button>
                    `;
                    
                    loadingDiv.querySelector('.speak-btn').addEventListener('click', () => {
                        speak(result.reply_en);
                    });

                    speak(result.reply_en);
                } catch (error) {
                    loadingDiv.innerHTML = `❌ 오류 발생: ${error.message}`;
                }
                chatBox.scrollTop = chatBox.scrollHeight;
            }

            sendBtn.addEventListener('click', sendMessage);
            userInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendMessage();
            });

            micBtn.addEventListener('click', () => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    alert('음성 인식을 지원하지 않는 브라우저입니다.');
                    return;
                }
                const recognition = new SpeechRecognition();
                recognition.lang = 'en-US';
                
                recognition.onstart = () => { micBtn.classList.add('recording'); };
                recognition.onend = () => { micBtn.classList.remove('recording'); };
                recognition.onresult = (event) => {
                    userInput.value = event.results[0][0].transcript;
                    sendMessage();
                };
                recognition.start();
            });
        });
    </script>
</body>
</html>
